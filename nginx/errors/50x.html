<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f14; color: #e8e8ed; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card { max-width: 480px; text-align: center; }
    .code { font-size: 88px; font-weight: 600; line-height: 1; color: #f5a623; letter-spacing: -2px; }
    h1 { font-size: 22px; font-weight: 500; margin: 20px 0 12px; }
    p { font-size: 15px; line-height: 1.6; color: #9a9aa6; margin-bottom: 28px; }
    button { background: #f5a623; color: #1a1a1a; border: none; padding: 11px 24px;
             border-radius: 8px; font-size: 15px; cursor: pointer; font-family: inherit; }
    button:hover { background: #d88f18; }
    .meta { margin-top: 32px; font-size: 12px; color: #55555f; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">Oops</div>
    <h1>Server abhi busy hai</h1>
    <p>Bahut zyada requests aa rahi hain ya server response nahi de raha. Thodi der baad try kijiye.</p>
    <button onclick="location.reload()">Retry</button>
    <div class="meta">Error 503 / 504</div>
  </div>
</body>
</html>
