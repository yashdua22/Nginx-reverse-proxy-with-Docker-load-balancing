<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Too many requests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f14; color: #e8e8ed; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card { max-width: 480px; text-align: center; }
    .code { font-size: 88px; font-weight: 600; line-height: 1; color: #e2564b; letter-spacing: -2px; }
    h1 { font-size: 22px; font-weight: 500; margin: 20px 0 12px; }
    p { font-size: 15px; line-height: 1.6; color: #9a9aa6; }
    .meta { margin-top: 32px; font-size: 12px; color: #55555f; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">429</div>
    <h1>Thoda dheere</h1>
    <p>Aapne bahut kam time mein bahut zyada requests bhej di hain. Kuch second ruk kar dobara try kijiye.</p>
    <div class="meta">Error 429 &middot; Too Many Requests</div>
  </div>
</body>
</html>
