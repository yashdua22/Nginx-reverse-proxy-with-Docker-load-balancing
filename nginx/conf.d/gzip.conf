gzip on;

# CDN/proxy ko batata hai ki compressed aur uncompressed dono versions hain
gzip_vary on;

# Proxied requests ko bhi compress karo (default off hota hai)
gzip_proxied any;

# 1-9 scale. 5 sweet spot hai — 6+ pe CPU zyada lagta hai, fayda kam
gzip_comp_level 5;

# Itne se chhote responses compress karna waste hai (header overhead zyada padega)
gzip_min_length 256;

# Purane IE browsers gzip properly handle nahi karte
gzip_disable "msie6";

# Kaunse content types compress karne hain
# NOTE: text/html hamesha compress hota hai, list mein daalne ki zarurat nahi
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/vnd.api+json
    image/svg+xml
    font/ttf
    font/otf;

# Compression buffers — 16 buffers of 8KB each
gzip_buffers 16 8k;

# HTTP/1.0 clients ko bhi compress karke bhejo
gzip_http_version 1.0;