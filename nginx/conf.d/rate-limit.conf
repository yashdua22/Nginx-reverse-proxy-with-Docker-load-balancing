# ZONE = shared memory jahan Nginx har IP ka counter rakhta hai
# $binary_remote_addr = client IP (compact form, kam memory leta hai)
# 10m = 10 MB memory (~160,000 IPs track kar sakta hai)

# General traffic — normal browsing ke liye
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# API endpoints — thoda strict
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Login jaisa sensitive endpoint — bahut strict
limit_req_zone $binary_remote_addr zone=strict:5m rate=1r/s;

# Ek IP se kitne simultaneous connections allowed
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Limit cross hone pe kaunsa status code bhejein
# 503 default hai, par 429 (Too Many Requests) zyada correct hai
limit_req_status 429;
limit_conn_status 429;

# Rate limit hits ko log karo — 'warn' level pe
limit_req_log_level warn;