# Nginx version chupao (attacker ko version pata na chale)
server_tokens off;

# Bade upload allow karo (default 1MB hai)
client_max_body_size 10M;

# Slow-loris attack se bachne ke liye timeouts
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;

# Keepalive — connection reuse, performance ke liye
keepalive_timeout 65s;