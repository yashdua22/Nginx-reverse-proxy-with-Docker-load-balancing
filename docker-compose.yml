services:
  backend1:
    build: ./app
    container_name: backend1
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend1
    ports:
      # 127.0.0.1 se bind kiya hai — bahar se direct access nahi hoga
      # Sirf Nginx (jo same machine pe hai) reach kar sakta hai
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend2:
    build: ./app
    container_name: backend2
    environment:
      - PORT=3000
      - INSTANCE_NAME=backend2
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"